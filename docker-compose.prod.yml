# Production stack: API + nginx (SPA + TLS reverse proxy). PostgreSQL is external.
# DATABASE_URL and other secrets come from .env on the host.
#
# First-time TLS (DNS A record for fboardpagec.com must point here; ports 80/443 open):
#   # Set CERTBOT_EMAIL in .env first
#   bash scripts/init-letsencrypt.sh
#   docker compose -f docker-compose.prod.yml run --rm api npm run db:migrate
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Browser-facing origin is baked into the SPA at image build time (same-origin /api).
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    env_file: .env
    environment:
      NODE_ENV: production
      API_PORT: "3000"
      CORS_ORIGIN: https://fboardpagec.com
    expose:
      - "3000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: production
      args:
        VITE_API_BASE_URL: https://fboardpagec.com
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    depends_on:
      - api
    restart: unless-stopped
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g \"daemon off;\"'"

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;"
    depends_on:
      - web
    restart: unless-stopped

volumes:
  certbot_www:
  certbot_certs:
