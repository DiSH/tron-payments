# Production stack: API + nginx (static SPA). PostgreSQL is external.
# DATABASE_URL and other secrets come from .env on the host.
#
#   docker compose -f docker-compose.prod.yml run --rm api npm run db:migrate
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Bake the browser-facing API URL into the SPA at image build time:
#   VITE_API_BASE_URL=https://api.example.com docker compose -f docker-compose.prod.yml build
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: production
    env_file: .env
    environment:
      NODE_ENV: production
      API_PORT: "3000"
    ports:
      - "${API_PORT:-3000}:3000"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: production
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3000}
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api
    restart: unless-stopped
